
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  padding: 22px;
  border-bottom: 1px solid #351010;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #ff2929;
  font-size: 22px;
  letter-spacing: 5px;
  font-weight: bold;
}

.status {
  color: #ff4545;
  font-size: 11px;
  letter-spacing: 2px;
}

main {
  min-height: 75vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.core {
  width: 190px;
  height: 190px;
  border: 2px solid #a90000;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 25px #710000,
              inset 0 0 30px #3c0000;
  animation: pulse 3s infinite;
}

.core-inner {
  width: 125px;
  height: 125px;
  border: 2px solid #ff2929;
  border-radius: 50%;
  box-shadow: 0 0 25px #ff1010;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ff3838;
  font-size: 30px;
  letter-spacing: 3px;
}

@keyframes pulse {
  50% {
    box-shadow: 0 0 45px #e00000,
                inset 0 0 40px #720000;
  }
}

h1 {
  font-size: 25px;
  letter-spacing: 6px;
  margin-top: 35px;
}

.subtitle {
  color: #777;
  letter-spacing: 3px;
  font-size: 11px;
  margin-top: 0;
}

#response {
  color: #ff5555;
  text-align: center;
  margin-top: 25px;
  min-height: 25px;
}

button {
  margin-top: 30px;
  padding: 17px 35px;
  background: #180707;
  border: 1px solid #d00000;
  color: #ff4040;
  border-radius: 5px;
  letter-spacing: 3px;
  font-size: 13px;
}

button:active {
  background: #650000;
}

footer {
  text-align: center;
  color: #444;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <div class="logo">J.A.R.V.I.S</div>
  <div class="status">SYSTEM ONLINE</div>
</header>

<main>
  <div class="core">
    <div class="core-inner">J</div>
  </div>

  <h1>JARVIS</h1>
  <p class="subtitle">PERSONAL AI SYSTEM</p>

  <div id="response">AWAITING INSTRUCTIONS</div>

  <button onclick="startListening()">
    ACTIVATE VOICE
  </button>
</main>

<footer>
  PERSONAL ARTIFICIAL INTELLIGENCE
</footer>


<script>
function startListening() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById("response").innerText =
      "VOICE RECOGNITION NOT SUPPORTED";
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-AU";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  document.getElementById("response").innerText =
    "LISTENING...";

  recognition.onresult = function(event) {
    const words = event.results[0][0].transcript;

    document.getElementById("response").innerText =
      "I HEARD: " + words;

    const reply = new SpeechSynthesisUtterance(
      "I heard you say " + words
    );

    reply.lang = "en-AU";
    reply.rate = 0.95;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(reply);
  };

  recognition.onerror = function(event) {
    document.getElementById("response").innerText =
      "VOICE ERROR: " + event.error;
  };

  recognition.start();
}
  </script>
  

</body>
</html>
